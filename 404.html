<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | Emna Tounssi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232744C8'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EET%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #F6F7FB; --surface: #FFFFFF; --ink: #0B1220; --muted: #5A6578; --line: #E1E6EF; --accent: #4338CA; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #090E18; --surface: #101828; --ink: #E8ECF4; --muted: #95A1B5; --line: #22304A; --accent: #8F98FF; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 400 1rem/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; }
  .code { font: 600 .8rem ui-monospace, Consolas, monospace; letter-spacing: .08em; color: var(--accent); }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 8px 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  .en { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 4px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 10px; }
  @media (prefers-color-scheme: dark) { a.btn { color: #0B1020; } }
</style>
</head>
<body>
<main>
  <p class="code">ERREUR 404</p>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incomplet, ou la page a été déplacée.</p>
  <p><a class="btn" href="/index.html">Retour à l'accueil</a></p>
  <div class="en" lang="en">
    <h1>This page does not exist</h1>
    <p>The link may be incomplete, or the page has moved.</p>
    <p><a class="btn" href="/en/index.html">Back to the home page</a></p>
  </div>
</main>
</body>
</html>
